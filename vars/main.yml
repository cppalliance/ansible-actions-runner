---
# ansible_facts.architecture -> the token GitHub uses in its release filenames.
# "64-bit" is what the Windows fact gatherer reports.
gha_runner_arch_map:
  x86_64: x64
  amd64: x64
  AMD64: x64
  64-bit: x64
  aarch64: arm64
  arm64: arm64
  armv7l: arm
  armv6l: arm

# ansible_facts.system -> GitHub's platform token.
gha_runner_os_map:
  Linux: linux
  Darwin: osx
  Win32NT: win

gha_runner_os: "{{ gha_runner_os_map[ansible_facts['system']] }}"
gha_runner_arch: "{{ gha_runner_arch_map[ansible_facts['architecture']] }}"

gha_runner_archive_ext: "{{ 'zip' if gha_runner_os == 'win' else 'tar.gz' }}"
gha_runner_archive_name: >-
  actions-runner-{{ gha_runner_os }}-{{ gha_runner_arch }}-{{ gha_runner_resolved_version }}.{{ gha_runner_archive_ext }}
gha_runner_archive_url: >-
  {{ gha_github_url }}/{{ gha_runner_download_repository }}/releases/download/v{{ gha_runner_resolved_version }}/{{ gha_runner_archive_name }}

# Downloaded once per host and unpacked once per runner.
gha_runner_archive_path: "/tmp/{{ gha_runner_archive_name }}"
gha_runner_archive_path_windows: 'C:\Windows\Temp\{{ gha_runner_archive_name }}'

# ansible_facts.system -> the hostname tasks for that platform.
gha_hostname_tasks_map:
  Linux: hostname_linux.yml
  Darwin: hostname_macos.yml
  Win32NT: hostname_windows.yml

# The domain part on its own. Windows stores it separately from the computer
# name rather than as one fully qualified string.
gha_hostname_domain: "{{ gha_hostname_fqdn.split('.', 1)[1] if '.' in gha_hostname_fqdn else '' }}"

# The three names macOS keeps, and what each should end up as. Only HostName
# can carry a domain: ComputerName is the user-facing label in System Settings,
# and LocalHostName is the Bonjour name, which has no use for one.
gha_macos_hostnames:
  ComputerName: "{{ gha_hostname }}"
  LocalHostName: "{{ gha_hostname }}"
  HostName: "{{ gha_hostname_fqdn if gha_hostname_fqdn | length > 0 else gha_hostname }}"

# Directory names are prefixed with a dot while the install is in flight, so a
# name without the dot always denotes a finished runner.
gha_staging_prefix: "."
gha_staging_suffix: ".staging"

# Whether anything on this host asked to take turns. Evaluated where it is
# used, so it reads gha_runners_normalized as preflight.yml leaves it.
gha_serial_requested: >-
  {{ gha_runners_normalized | default([]) | map(attribute='serial_execution')
     | map('bool') | select | list | length > 0 }}

gha_serial_scripts_path: >-
  {{ gha_serial_scripts_dir if gha_serial_scripts_dir | length > 0 else gha_runner_home_path ~ '/scripts' }}
gha_serial_lock_dir: "{{ gha_serial_lock_file | dirname }}"

# Windows keeps the scripts beside the runner directories rather than under a
# home: the runners live off the drive root for the same service-account
# reasons, and gha_runners_path is resolved by then.
gha_serial_scripts_path_windows: >-
  {{ gha_serial_scripts_dir if gha_serial_scripts_dir | length > 0 else gha_runners_path ~ '\scripts' }}

# The identity a job holds the serial-execution lock under. Both hook scripts
# render this one expression: the completion hook releases the lock only while
# the value in it still matches, and if the two ever computed the identity
# differently a job would refuse to release its own lock.
#
# The job's own environment is the only thing both hooks share — they are
# separate processes with nothing between them but the lock file — and the run
# id distinguishes concurrent jobs, the attempt a retry, the runner name two
# runners on this machine running the same job of the same workflow.
gha_serial_owner_expr: >-
  ${RUNNER_NAME:-unknown-runner}/${GITHUB_RUN_ID:-no-run-id}/${GITHUB_RUN_ATTEMPT:-1}/${GITHUB_JOB:-no-job}
