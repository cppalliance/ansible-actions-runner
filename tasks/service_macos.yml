---
# `svc.sh install` on macOS writes a LaunchAgent into ~/Library/LaunchAgents,
# which only starts once the runner user logs into the GUI. That is the bug
# discussed in https://github.com/actions/runner/issues/1056. Instead of
# calling svc.sh we write the equivalent LaunchDaemon ourselves, so the runner
# comes up at boot over plain SSH with nobody logged in.
- name: "Install the LaunchDaemon for {{ runner.dirname }}"
  when: gha_macos_use_launch_daemon | bool
  block:
    # config.sh already generated svc.sh with the correct label baked in
    # (actions.runner.<owner>-<repo>.<runner-name>, truncated and de-spaced by
    # the runner itself). Reading it back beats re-deriving those rules here.
    - name: "Read the service label generated by config.sh for {{ runner.dirname }}"
      ansible.builtin.slurp:
        src: "{{ gha_runner_final_path }}/svc.sh"
      become: true
      register: gha_runner_svc_sh

    - name: "Record the LaunchDaemon paths for {{ runner.dirname }}"
      ansible.builtin.set_fact:
        gha_macos_svc_name: "{{ _gha_svc_name }}"
        gha_macos_plist_path: "/Library/LaunchDaemons/{{ _gha_svc_name }}.plist"
      vars:
        _gha_svc_name: >-
          {{ ((gha_runner_svc_sh.content | b64decode)
              | regex_search('SVC_NAME="([^"]+)"', '\1') | first) | replace(' ', '_') }}

    # svc.sh would normally do this. runsvc.sh is the entry point GitHub
    # requires any custom service to use.
    - name: "Place runsvc.sh at the runner root for {{ runner.dirname }}"
      ansible.builtin.copy:
        src: "{{ gha_runner_final_path }}/bin/runsvc.sh"
        dest: "{{ gha_runner_final_path }}/runsvc.sh"
        remote_src: true
        owner: "{{ gha_runner_user }}"
        group: "{{ gha_runner_group_resolved }}"
        mode: "0755"
      become: true

    - name: "Create the log directory for {{ runner.dirname }}"
      ansible.builtin.file:
        path: "{{ gha_runner_home_path }}/Library/Logs/{{ gha_macos_svc_name }}"
        state: directory
        owner: "{{ gha_runner_user }}"
        group: "{{ gha_runner_group_resolved }}"
        mode: "0755"
      become: true

    # root:wheel and 0644 are load-bearing. launchd rejects a daemon plist with
    # any other ownership as "Load failed: 5: Input/output error".
    - name: "Write the LaunchDaemon plist for {{ runner.dirname }}"
      ansible.builtin.template:
        src: launchdaemon.plist.j2
        dest: "{{ gha_macos_plist_path }}"
        owner: root
        group: wheel
        mode: "0644"
      become: true

    # The runner reads .service when it self-updates so it can restart itself.
    # svc.sh stores the full plist path here on macOS, so we match that.
    - name: "Record the service path for {{ runner.dirname }}"
      ansible.builtin.copy:
        content: "{{ gha_macos_plist_path }}\n"
        dest: "{{ gha_runner_final_path }}/.service"
        owner: "{{ gha_runner_user }}"
        group: "{{ gha_runner_group_resolved }}"
        mode: "0644"
      become: true

    - name: "Bootstrap the LaunchDaemon for {{ runner.dirname }}"
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - bootstrap
          - system
          - "{{ gha_macos_plist_path }}"
      become: true
      register: gha_launchctl_bootstrap
      changed_when: gha_launchctl_bootstrap.rc == 0
      failed_when: false
      when: gha_macos_launchctl_method == 'bootstrap'

    - name: "Load the LaunchDaemon for {{ runner.dirname }}"
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - load
          - -w
          - "{{ gha_macos_plist_path }}"
      become: true
      register: gha_launchctl_load
      changed_when: gha_launchctl_load.rc == 0
      failed_when: false
      when: >-
        gha_macos_launchctl_method != 'bootstrap'
        or gha_launchctl_bootstrap.rc | default(1) != 0

    - name: "Confirm the LaunchDaemon for {{ runner.dirname }} is registered"
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print
          - "system/{{ gha_macos_svc_name }}"
      become: true
      register: gha_launchctl_print
      changed_when: false
      retries: 5
      delay: 2
      until: gha_launchctl_print.rc == 0

- name: "Install the LaunchAgent for {{ runner.dirname }}"
  when: not (gha_macos_use_launch_daemon | bool)
  block:
    - name: "Run svc.sh install for {{ runner.dirname }}"
      ansible.builtin.command:
        argv:
          - ./svc.sh
          - install
        chdir: "{{ gha_runner_final_path }}"
      become: true
      become_user: "{{ gha_runner_user }}"
      environment:
        HOME: "{{ gha_runner_home_path }}"
        USER: "{{ gha_runner_user }}"
      changed_when: true

    - name: "Run svc.sh start for {{ runner.dirname }}"
      ansible.builtin.command:
        argv:
          - ./svc.sh
          - start
        chdir: "{{ gha_runner_final_path }}"
      become: true
      become_user: "{{ gha_runner_user }}"
      environment:
        HOME: "{{ gha_runner_home_path }}"
        USER: "{{ gha_runner_user }}"
      changed_when: true
