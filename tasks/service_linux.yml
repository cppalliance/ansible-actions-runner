---
- name: "Install the systemd unit for {{ runner.dirname }}"
  ansible.builtin.command:
    argv:
      - ./svc.sh
      - install
      - "{{ gha_runner_user }}"
    chdir: "{{ gha_runner_final_path }}"
  become: true
  changed_when: true

- name: "Start the systemd unit for {{ runner.dirname }}"
  ansible.builtin.command:
    argv:
      - ./svc.sh
      - start
    chdir: "{{ gha_runner_final_path }}"
  become: true
  changed_when: true

- name: "Read back the unit name for {{ runner.dirname }}"
  ansible.builtin.slurp:
    src: "{{ gha_runner_final_path }}/.service"
  become: true
  register: gha_runner_unit_name

- name: "Confirm the unit for {{ runner.dirname }} is running"
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ (gha_runner_unit_name.content | b64decode) | trim }}"
  become: true
  register: gha_runner_unit_state
  changed_when: false
  retries: 5
  delay: 2
  until: gha_runner_unit_state.rc == 0
