---
# Runs from the rescue block of install_unix_runner.yml. Every task here is
# best-effort: the install already failed, and the goal is only to get back to
# a clean slate so the next run can retry. The caller fails afterwards
# regardless of what happens in here.

- name: "Locate the partial install of {{ runner.dirname }}"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ gha_runner_final_path }}"
    - "{{ gha_runner_staging_path }}"
  become: true
  register: gha_cleanup_stat
  failed_when: false

- name: "Pick the directory to roll back for {{ runner.dirname }}"
  ansible.builtin.set_fact:
    gha_cleanup_path: >-
      {{ gha_cleanup_stat.results | selectattr('stat.exists', 'defined')
         | selectattr('stat.exists') | map(attribute='item') | list | first | default('', true) }}

- name: "Roll back {{ runner.dirname }}"
  when: gha_cleanup_path | length > 0
  block:
    - name: "Check what the failed install of {{ runner.dirname }} left behind"
      ansible.builtin.stat:
        path: "{{ gha_cleanup_path }}/{{ item }}"
      loop:
        - .service
        - .credentials
      become: true
      register: gha_cleanup_artifacts
      failed_when: false

    - name: "Record what needs undoing for {{ runner.dirname }}"
      ansible.builtin.set_fact:
        gha_cleanup_has_service: "{{ gha_cleanup_artifacts.results[0].stat.exists | default(false) }}"
        gha_cleanup_is_registered: "{{ gha_cleanup_artifacts.results[1].stat.exists | default(false) }}"

    - name: "Remove the systemd unit for {{ runner.dirname }}"
      ansible.builtin.command:
        argv:
          - ./svc.sh
          - uninstall
        chdir: "{{ gha_cleanup_path }}"
      become: true
      changed_when: true
      failed_when: false
      when:
        - gha_runner_os == 'linux'
        - gha_cleanup_has_service | bool

    - name: "Unload the LaunchDaemon for {{ runner.dirname }}"
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - bootout
          - "system/{{ gha_macos_svc_name }}"
      become: true
      changed_when: true
      failed_when: false
      when:
        - gha_runner_os == 'osx'
        - gha_macos_svc_name is defined

    - name: "Remove the LaunchDaemon plist for {{ runner.dirname }}"
      ansible.builtin.file:
        path: "{{ gha_macos_plist_path }}"
        state: absent
      become: true
      failed_when: false
      when:
        - gha_runner_os == 'osx'
        - gha_macos_plist_path is defined

    # Without this the repo keeps an offline runner entry pointing at a machine
    # that no longer has it.
    - name: "Mint a removal token for {{ runner.repo }}"
      ansible.builtin.uri:
        url: "{{ gha_github_api_url }}/repos/{{ runner.repo }}/actions/runners/remove-token"
        method: POST
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
          Authorization: "Bearer {{ gha_github_token }}"
        body_format: json
        status_code: 201
      register: gha_removal
      delegate_to: localhost
      become: false
      no_log: "{{ gha_hide_sensitive_logs | bool }}"
      failed_when: false
      when: gha_cleanup_is_registered | bool

    - name: "Unregister {{ runner.runner_name }} from {{ runner.repo }}"
      ansible.builtin.command:
        argv:
          - ./config.sh
          - remove
          - --token
          - "{{ gha_removal.json.token }}"
        chdir: "{{ gha_cleanup_path }}"
      become: true
      become_user: "{{ gha_runner_user }}"
      changed_when: true
      failed_when: false
      no_log: "{{ gha_hide_sensitive_logs | bool }}"
      when:
        - gha_cleanup_is_registered | bool
        - gha_removal.json.token is defined

    - name: "Delete the directory for {{ runner.dirname }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ gha_runner_final_path }}"
        - "{{ gha_runner_staging_path }}"
      become: true
