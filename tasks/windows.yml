---
# Windows runners default to a path off the drive root rather than a user
# profile, because the service logs on as NETWORK SERVICE by default and that
# account cannot read another user's profile directory.
- name: Resolve the runners parent directory
  ansible.builtin.set_fact:
    gha_runners_path: "{{ gha_runners_dir if gha_runners_dir | length > 0 else gha_runners_dir_windows }}"

- name: Assert that a password was supplied for a named logon account
  ansible.builtin.assert:
    that:
      - gha_windows_logon_password | length > 0
    fail_msg: >-
      gha_windows_logon_account is set to '{{ gha_windows_logon_account }}', which is a
      real account, so gha_windows_logon_password must be set as well (vault it).
      Built-in service accounts such as 'NT AUTHORITY\NETWORK SERVICE' need no password.
    quiet: true
  when:
    - gha_runners | length > 0
    - not gha_windows_logon_account.upper().startswith('NT AUTHORITY\\')

# Kept ahead of everything else the way the Linux package step is: what
# follows may depend on what it installs — git bash for the serial-execution
# hooks above all.
#
# Chocolatey's own Ansible module is deliberately not used. It takes inventory
# with `choco list --all-versions`, an argument Chocolatey CLI 2.5 removed, so
# against a current choco every call fails before installing anything, and
# chocolatey-ansible has no released fix. Calling choco directly is both what
# works and one less collection for a Windows control node to install.
#
# choco is run by absolute path throughout, never through PATH: the WinRM
# service's environment dates from boot, so a choco installed by the task
# above would not be on the PATH this play can see.
- name: Install Chocolatey if it is missing
  ansible.windows.win_shell: |
    Set-ExecutionPolicy Bypass -Scope Process -Force
    [System.Net.ServicePointManager]::SecurityProtocol =
        [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
    Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
  args:
    creates: "{{ gha_windows_choco }}"
  when: gha_win_packages | length > 0

- name: Check that Chocolatey is where gha_windows_choco says
  ansible.windows.win_stat:
    path: "{{ gha_windows_choco }}"
  register: gha_windows_choco_stat
  when: gha_win_packages | length > 0

- name: Assert that Chocolatey can be called
  ansible.builtin.assert:
    that:
      - gha_windows_choco_stat.stat.exists
    fail_msg: >-
      {{ gha_windows_choco }} does not exist even after bootstrapping
      Chocolatey. If this machine keeps Chocolatey somewhere else, point
      gha_windows_choco at it, or set gha_win_packages to [] and install
      {{ gha_win_packages | join(', ') }} some other way.
    quiet: true
  when: gha_win_packages | length > 0

# Exit code 2 means "already installed, nothing done" when the machine has
# useEnhancedExitCodes turned on, which is not a failure
# (chocolatey-ansible#168). The names travel as JSON through a literal
# here-string and are splatted, the same way config.cmd's arguments are.
- name: Install packages
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $packages = @'
    {{ gha_win_packages | to_json }}
    '@ | ConvertFrom-Json
    & '{{ gha_windows_choco }}' install --yes --no-progress @packages
    if ($LASTEXITCODE -notin @(0, 2)) { throw "choco install exited with $LASTEXITCODE" }
  register: gha_choco_install
  changed_when: "'installed 0/' not in gha_choco_install.stdout"
  when: gha_win_packages | length > 0

- name: Ensure the runners parent directory exists
  ansible.windows.win_file:
    path: "{{ gha_runners_path }}"
    state: directory

- name: Install the serial-execution job hooks
  ansible.builtin.include_tasks: serial_hooks_windows.yml
  when: gha_serial_requested | bool

- name: Check which runner directories already exist
  ansible.windows.win_stat:
    path: "{{ gha_runners_path }}\\{{ item.dirname }}"
  loop: "{{ gha_runners_normalized }}"
  loop_control:
    label: "{{ item.dirname }}"
  register: gha_runner_dir_stat

- name: Split the runners into pending and already-installed
  ansible.builtin.set_fact:
    gha_runners_pending: "{{ gha_runner_dir_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
    gha_runners_present: "{{ gha_runner_dir_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"

- name: Report the runners left untouched
  ansible.builtin.debug:
    msg: >-
      Skipping {{ gha_runners_present | map(attribute='dirname') | join(', ') }}
      — directory already present. Delete it by hand to force a reinstall.
  when: gha_runners_present | length > 0

- name: Download the runner archive
  ansible.windows.win_get_url:
    url: "{{ gha_runner_archive_url }}"
    dest: "{{ gha_runner_archive_path_windows }}"
  when: gha_runners_pending | length > 0

- name: Install each pending runner
  ansible.builtin.include_tasks: install_windows_runner.yml
  loop: "{{ gha_runners_pending }}"
  loop_control:
    loop_var: runner
    label: "{{ runner.dirname }}"
