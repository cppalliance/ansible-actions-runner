---
# Driven through scutil rather than ansible.builtin.hostname, which cannot
# express what is wanted here. The module's Darwin strategy insists all three
# macOS names hold the value it was given — it compares
# (HostName, ComputerName, LocalHostName) against the name as a tuple and
# rewrites all three if any one of them differs. Giving it the short name and
# then setting HostName to the fully qualified one leaves the two steps undoing
# each other on every run, forever: the module resets HostName to the short
# name, the next task sets it back. Both report changed, and in between the
# machine briefly answers to the wrong name.
#
# scutil is what the module calls anyway, so nothing is lost by addressing the
# three names separately, and each can then be left alone when it is correct.

- name: Read the names macOS currently holds
  ansible.builtin.command:
    argv:
      - /usr/sbin/scutil
      - --get
      - "{{ item }}"
  loop: "{{ gha_macos_hostnames.keys() | list }}"
  register: gha_macos_current
  changed_when: false
  # scutil exits non-zero for a name that has never been set, which is the
  # normal state of a fresh machine rather than an error.
  failed_when: false

- name: Set the names that are not already right
  ansible.builtin.command:
    argv:
      - /usr/sbin/scutil
      - --set
      - "{{ item.item }}"
      - "{{ gha_macos_hostnames[item.item] }}"
  become: true
  changed_when: true
  when: item.stdout | default('') | trim != gha_macos_hostnames[item.item]
  loop: "{{ gha_macos_current.results }}"
  loop_control:
    label: "{{ item.item }}"
